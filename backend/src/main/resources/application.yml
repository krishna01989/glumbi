spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:glumbi}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never
    whitelabel:
      enabled: false

elevenlabs:
  api-key: ${ELEVENLABS_API_KEY:}

anthropic:
  api-key: ${ANTHROPIC_API_KEY}
  base-url: https://api.anthropic.com
  messages-path: /v1/messages
  version: "2023-06-01"
  model: claude-haiku-4-5-20251001       # main model used by all agents
  fast-model: claude-haiku-4-5-20251001  # lightweight model for quick classification tasks
  max-tokens:
    story: 512
    activity: 1024
    curiosity: 512
    read-quiz: 1024
    writing-coach: 300
    translation: 2048
    milestone: 100
    progress-report: 200
    learning-insight: 150
    story-recommendation: 150
    relevance: 10
    learn-pronunciation: 200
    learn-letter: 400
    draw: 256
    memory-flashcards: 512
    word-of-day: 256
    memory-match: 256
    journal: 600
    draw-guide: 300

app:
  env: ${APP_ENV:local}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:glumbi-super-secret-key-change-in-production-min-32-chars}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    token-info-url: https://oauth2.googleapis.com/tokeninfo
  turnstile:
    secret: ${TURNSTILE_SECRET_KEY:}
    verify-url: https://challenges.cloudflare.com/turnstile/v0/siteverify
  quota:
    default-monthly-credits: 200
    notification-history-days: 30

voyage:
  api-key: ${VOYAGE_API_KEY:}
  embed-url: https://api.voyageai.com/v1/embeddings
  model: voyage-3
  dimensions: 1024
  similar-limit: 3
