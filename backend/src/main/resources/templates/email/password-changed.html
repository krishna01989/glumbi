<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;background:#f5f5f5;font-family:'Nunito',Arial,Helvetica,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f5f5f5;padding:32px 0;">
    <tr>
      <td align="center">
        <table width="560" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;width:100%;">

          <!-- Header -->
          <tr>
            <td style="background:#ffffff;padding:24px 32px;text-align:center;border-bottom:3px solid #ff6b6b;">
              <img th:src="${brandLogoUrl}" alt="Glumbi" width="140" style="display:block;margin:0 auto;">
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="background:#ffffff;padding:36px 32px;">
              <p style="margin:0 0 20px;font-size:15px;color:#555555;line-height:1.6;">
                <span th:text="${salutation}">Dear Glumbi User,</span>
              </p>
              <h2 style="margin:0 0 12px;font-size:20px;font-weight:800;color:#1a1a2e;">Password changed</h2>
              <p style="margin:0 0 20px;font-size:15px;color:#555555;line-height:1.6;">
                Your Glumbi account password was successfully changed
                <span th:text="${context}"></span>.
              </p>
              <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px;">
                <tr>
                  <td style="background:#fff8f8;padding:16px 20px;border-left:4px solid #ff6b6b;">
                    <p style="margin:0;font-size:13px;color:#555555;line-height:1.6;">
                      If this was you, no action is needed.<br>
                      If you did <strong>not</strong> make this change, please
                      <a th:href="${brandContactUrl}" style="color:#ff6b6b;font-weight:700;">contact us immediately</a>.
                    </p>
                  </td>
                </tr>
              </table>
              <table cellpadding="0" cellspacing="0" border="0" style="margin:0 0 28px auto;">
                <tr>
                  <td style="background:#ff6b6b;padding:12px 32px;text-align:center;">
                    <a th:href="${brandLoginUrl}" style="color:#ffffff;font-size:14px;font-weight:700;text-decoration:none;">Sign in to Glumbi</a>
                  </td>
                </tr>
              </table>
              <p style="margin:0;font-size:14px;color:#555555;line-height:1.8;">
                Warm regards,<br>
                <strong>The Glumbi Team</strong>
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:20px;text-align:center;">
              <p style="margin:0;font-size:12px;color:#aaaaaa;">
                &copy; Glumbi &nbsp;&middot;&nbsp;
                <a th:href="${brandPrivacyUrl}" style="color:#aaaaaa;">Privacy</a>
                &nbsp;&middot;&nbsp;
                <a th:href="${brandContactUrl}" style="color:#aaaaaa;">Contact</a>
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
