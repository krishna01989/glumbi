<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glumbi ✨ Where little stories grow</title>
    <meta name="description" content="Personalized bedtime stories and milestone journal for your little one" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  </head>
  <body>
    <div id="root">
      <!-- Shown only if React fails to mount (JS bundle error, network down, CDN outage) -->
      <div id="ui-fallback" style="
        min-height:100vh; display:flex; flex-direction:column;
        align-items:center; justify-content:center; padding:32px 20px;
        font-family:'Nunito',system-ui,sans-serif; background:#fff5f3; text-align:center;
      ">
        <div style="
          width:120px; height:120px; border-radius:50%;
          background:linear-gradient(135deg,#ff6b6b,#ff8e53);
          display:flex; align-items:center; justify-content:center;
          font-size:52px; margin-bottom:28px;
          box-shadow:0 16px 48px rgba(255,107,107,0.35);
        ">✨</div>
        <div style="
          display:inline-block; background:#ffe0db; color:#e8503a;
          border-radius:50px; padding:4px 18px; font-size:12px;
          font-weight:800; letter-spacing:0.5px; margin-bottom:16px;
        ">GLUMBI</div>
        <h1 style="font-size:28px; color:#2d2d2d; margin:0 0 12px; font-weight:800;">Taking a quick break</h1>
        <p style="font-size:16px; color:#888; line-height:1.8; max-width:420px; margin:0 0 32px;">
          We're making things better for you and your little one.<br/>
          Please try again in a moment — we'll be right back!
        </p>
        <button onclick="window.location.reload()"
          style="
            padding:13px 36px; border-radius:50px; border:none; cursor:pointer;
            background:linear-gradient(135deg,#ff6b6b,#ff8e53); color:white;
            font-size:15px; font-weight:800; font-family:inherit;
            box-shadow:0 6px 24px rgba(255,107,107,0.4);
          ">
          Try Again
        </button>
        <p style="margin-top:32px; font-size:12px; color:#ccc;">
          Still stuck? Email us at <a href="mailto:hello@glumbi.com" style="color:#ffb3a7;">hello@glumbi.com</a>
        </p>
      </div>
    </div>
    <noscript>
      <div style="
        min-height:100vh; display:flex; flex-direction:column;
        align-items:center; justify-content:center; padding:32px 20px;
        font-family:system-ui,sans-serif; background:#f9f9f9; text-align:center;
      ">
        <div style="font-size:52px; margin-bottom:20px;">🔌</div>
        <h1 style="font-size:24px; color:#2d2d2d; margin:0 0 10px;">JavaScript is disabled</h1>
        <p style="font-size:15px; color:#777; max-width:380px;">
          Glumbi needs JavaScript to run. Please enable it in your browser settings and reload the page.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      /* Once React mounts, it replaces #root's children — this fallback disappears automatically.
         If the bundle errors before mount, the fallback stays visible. */
      window.addEventListener('error', function(e) {
        if (e.filename && e.filename.includes('/src/')) {
          var fb = document.getElementById('ui-fallback')
          if (fb) fb.style.display = 'flex'
        }
      })
    </script>
  </body>
</html>
